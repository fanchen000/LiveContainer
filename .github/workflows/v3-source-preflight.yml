name: V3 auto-refresh source preflight

on:
  push:
    branches:
      - 'fix/v3-autorefresh-ci-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check scheduler and packaging declarations
        run: python3 scripts/ci/check_v3_autorefresh_source.py
      - name: Test fail-closed offline upgrade parity policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_verify_upgrade_parity.py' -v
      - name: Check Swift package files tracked
        run: |
          git ls-files --error-unmatch \
            LiveContainerSwiftUI/App/LiveContainerAutoRefreshAlarm.swift \
            SideStoreSupport/V3SharedAppGroup.swift \
            LiveContainerSwiftUI/Utilities/CombinedFailure.swift \
            LiveContainerSwiftUI/Utilities/V3BehavioralPrimitives.swift \
            LiveContainerSwiftUI/Utilities/V3AuthServiceSnapshot.swift \
            LiveContainerSwiftUI/Views/Settings/LCEmbeddedSideStoreRefreshView.swift
